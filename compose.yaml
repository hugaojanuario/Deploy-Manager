services:
  postgres:
    image: postgres:15
    container_name: deploymanager_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:3.9.0
    container_name: deploymanager_kafka
    ports:
      - "9092:9092"